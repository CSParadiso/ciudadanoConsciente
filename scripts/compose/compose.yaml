version: '3.1'

services:

  db:
    image: postgres:16-alpine
    container_name: postgres
    deploy:
      resources:
        limits:
          memory: 50M # Limita a 50MB máximo de RAM
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
    ports:
      - 3707:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d  # Montar los scripts de inicialización (solo sirve si no hay nada en el directorio de datos mencionados arriba).
    networks:
      - ciudadano
    hostname:
      "postgres"

  adminer:
    image: adminer:4.8.1-standalone
    container_name: adminer
    deploy:
      resources:
        limits:
          memory: 50M
    restart: always
    ports:
      - 3706:8080
    networks:
      - ciudadano
    depends_on:
      - db

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    deploy:
      resources:
        limits:
          memory: 500M
    restart: always
    ports:
      - 3704:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin # esta clave solo se setea si no existe ninguna, debemos cambiar esta clave
      - KC_HOSTNAME_URL=http://localhost:3704 # Para poder acceder desde afuera de la red del contenedor
      - KC_HOSTNAME_ADMIN_URL=http://localhost:3704 # Para poder acceder desde fuera de la red del contenedor
      - KC_HOSTNAME_STRICT_BACKCHANNEL=true
      - KC_PROXY=edge # permite HTTP
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_SCHEMA=keycloak
      - KC_DB_USERNAME=saimon
      - KC_DB_PASSWORD=chipaParaguaya
      - KC_FEATURES=docker,admin-fine-grained-authz
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    command: start --log="console,file" 
    volumes:
       - ./logs:/opt/keycloak/data/log/ # mapeamos carpeta de logs para que se guarden fuera del contenedor
    networks:
       - ciudadano
    hostname:
      "keycloak"
    depends_on:
       - db 


  api-ciudadano-consciente:
    image: saimon/api-ciudadano-consciente:1.0.0
    container_name: ciuco
    deploy:
      resources:
        limits:
          memory: 500M
    restart: always
    ports:
      - 3705:5909
    environment:
      - QUARKUS_DATASOURCE_USERNAME=saimon
      - QUARKUS_DATASOURCE_PASSWORD=chipaParaguaya 
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/ciudadano_consciente
      - QUARKUS_DATASOURCE_JDBC_MAX_SIZE=16
      - QUARKUS_OIDC_AUTH_SERVER_URL=http://keycloak:8080/realms/Ciudadano/ # Acceder desde el servicio interno
        # - QUARKUS_OIDC_AUTH_SERVER_URL=http://localhost:3704/realms/Ciudadano/
      - QUARKUS_OIDC_CLIENT_ID=api-ciudadano-consciente
      - QUARKUS_OIDC_CREDENTIALS_SECRET=aI0vuHuOknkpSEwRF87iCVrK9C1Fu2hz
      - QUARKUS_OIDC_AUTHENTICATION_USER_INFO_REQUIRE=true
    depends_on:
      - keycloak
    networks:
      - ciudadano
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://keycloak:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ciudadano:
    driver: bridge  

volumes:
  pg_data:
