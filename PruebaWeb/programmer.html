<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programmer</title>
</head>
<body>
  
  <header class="header">
    <nav class="nav"></nav>
  </header>
  
  <section class="templates"></section>
  <section class="subscribeTemplates">

    <!-- subscription-form.html -->
    <form id="subscription-form">
      <label for="name">Name: </label>
      <input type="text" id="name" name="name" placeholder="Enter name">

      <label for="description">Description: </label>
      <input type="text" id="description" name="description" placeholder="Enter description">

      <label for="creator">Creator: </label>
      <input type="text" id="creator" name="creator" placeholder="Enter creator">

      <label for="functionalTemplateUrl">Functional Template URL: </label>
      <input type="text" id="user" name="user" placeholder="Enter Github username">
      <input type="text" id="repo" name="repo" placeholder="Enter Repository name">
      <input type="text" id="path" name="path" placeholder="Enter path of the folder">

      <button type="submit">Subscribe</button>
    </form>

  </section>
  
  <footer class="footer"></footer>
  
  <script src="main.js" defer></script>

</body>
</html>
