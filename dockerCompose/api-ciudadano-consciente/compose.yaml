version: "3.6"
services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: always
    ports:
      - 3704:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=chipaParaguaya
      - KC_HOSTNAME_URL=http://192.168.1.17:3704
      - KC_HOSTNAME_ADMIN_URL=http://192.168.1.17:3704
      - KC_HOSTNAME_STRICT_BACKCHANNEL=true
      - KC_PROXY=edge
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://192.168.1.17:5432/keycloak
      - KC_DB_SCHEMA=keycloak
      - KC_DB_USERNAME=saimon
      - KC_DB_PASSWORD=chipaParaguaya
      - KC_FEATURES=docker,admin-fine-grained-authz
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    command: start --log="console,file" 
    volumes:
      - ./logs:/opt/keycloak/data/log/
    networks:
      - my_network

  api-ciudadano-consciente:
    image: saimon/ciuco:1.0.0
    container_name: ciuco
    restart: always
    ports:
      - 3705:8080
    environment:
      - QUARKUS_DATASOURCE_USERNAME=saimon
      - QUARKUS_DATASOURCE_PASSWORD=chipaParaguaya 
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://192.168.1.17:5432/ciudadano_consciente
      - QUARKUS_DATASOURCE_JDBC_MAX_SIZE=16
      - QUARKUS_OIDC_AUTH_SERVER_URL=http://192.168.1.17:3704/realms/Ciudadano/
      - QUARKUS_OIDC_CLIENT_ID=api-ciudadano-consciente
      - QUARKUS_OIDC_CREDENTIALS_SECRET=127iCwfSvfEsiLmlA0NKNNLzvrKLlRy0
      - QUARKUS_OIDC_AUTHENTICATION_USER_INFO_REQUIRE=true
    depends_on:
      - keycloak
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

