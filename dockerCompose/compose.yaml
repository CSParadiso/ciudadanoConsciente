version: '3.1'

services:

  db:
    image: postgres:16
    container_name: postgres
    deploy:
      resources:
        limits:
          memory: 50M # Limita a 50MB máximo de RAM
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
    ports:
      - 3700:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ciudadano
    hostname:
      "postgres"

  adminer:
    image: adminer:4.8.1-standalone
    container_name: adminer
    deploy:
      resources:
        limits:
          memory: 50M
    restart: always
    ports:
      - 3706:8080
    networks:
      - ciudadano
    depends_on:
      - db

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak
    deploy:
      resources:
        limits:
          memory: 500M
    restart: always
    ports:
      - 3704:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=chipaParaguaya # esta clave solo se setea si no existe ninguna, debemos cambiar esta clave
        #- KC_HOSTNAME_URL=http://localhost:3704 # Para poder acceder desde afuera de la red del contenedor
      - KC_HOSTNAME_URL=http://192.168.43.216:3704 # Esta url debe poder ser accesible por fuera de la red del contenedor (si la mapeamos internamente, desde fuera no saben el nombre del servicio.) 
      - KC_HOSTNAME_ADMIN_URL=http://localhost:3704 # Esta url debe poder ser accesible por fuera de la red del contenedor (si la mapeamos internamente, desde fuera no saben el nombre del servicio.)
      - KC_HOSTNAME_STRICT_BACKCHANNEL=true
      - KC_PROXY=edge # permite HTTP
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_SCHEMA=keycloak
      - KC_DB_USERNAME=saimon
      - KC_DB_PASSWORD=citizen
      - KC_FEATURES=docker,admin-fine-grained-authz
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    command: start --log="console,file" 
    volumes:
       - ./keycloak/logs:/opt/keycloak/data/log/ # mapeamos carpeta de logs para que se guarden fuera del contenedor
    networks:
       - ciudadano
    hostname:
      "keycloak"
    depends_on:
       - db 


  api-ciudadano-consciente:
    image: saimon/api-ciudadano-consciente:1.0.0
    # DESDE DOCKERHUB image: csparadiso/ciudadano-consciente:API1.0 
    container_name: ciuco
    deploy:
      resources:
        limits:
          memory: 500M
    restart: always
    ports:
      - 3705:5909
    environment:
      - QUARKUS_DATASOURCE_USERNAME=saimon
      - QUARKUS_DATASOURCE_PASSWORD=citizen 
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/ciudadano_consciente
      - QUARKUS_DATASOURCE_JDBC_MAX_SIZE=16
      - QUARKUS_OIDC_AUTH_SERVER_URL=http://keycloak:8080/realms/Ciudadano/ # Acceder desde el servicio interno
        #- QUARKUS_OIDC_AUTH_SERVER_URL=http://localhost:8080/realms/Ciudadano/
      - QUARKUS_OIDC_CLIENT_ID=api-ciudadano-consciente
      - QUARKUS_OIDC_CREDENTIALS_SECRET=aI0vuHuOknkpSEwRF87iCVrK9C1Fu2hz
      - QUARKUS_OIDC_AUTHENTICATION_USER_INFO_REQUIRE=true
      - FILE_SYSTEM_IMAGES_VERSION_THUMBNAIL=/var/tmp/CiudadanoConsciente/resources/images/activity-type-version/thumbnail
      - FILE_SYSTEM_IMAGES_CONTENT=/var/tmp/CiudadanoConsciente/resources/images/content
      - IMAGE_MAX_MB_SIZE=5
      - QUARKUS_LOG_FILE_ROTATION_FILE_SUFFIX=.yyyyMMdd
    depends_on:
      - keycloak
    networks:
      - ciudadano
    volumes: # volumeName:containerFileSystem
      - logs:/home/jboss/logs
      - images_thumbnail:/var/tmp/CiudadanoConsciente/resources/images/activity-type-version/thumbnail
      - images_content:/var/tmp/CiudadanoConsciente/resources/images/content

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://keycloak:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ciudadano:
    driver: bridge  

volumes:
  pg_data:
  logs: # This volume is just mounted inside the container. Is only persisted in the filesystem outside the container.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/saimon/Projects/CiudadanoConsciente/resources/logs 
  images_thumbnail: # This volume is just mounted inside the container. Is only persisted in the filesystem outside the container.
    driver: local
    driver_opts:
      type: none
      o: bind 
      device: /home/saimon/Projects/CiudadanoConsciente/resources/images/activity-type-version/thumbnail # hostmachine path binded to volume (this is a property totally customizable)
  images_content: # This volume is just mounted inside the container. Is only persisted in the filesystem outside the container.
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/saimon/Projects/CiudadanoConsciente/resources/images/content
